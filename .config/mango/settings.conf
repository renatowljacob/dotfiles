# Master/stack
new_is_master=1
default_master_factor=0.55
default_master_count=1

# Monocle
monocle_no_border=1
monocle_no_gap=1
monocle_no_radius=1

# Scroller
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# Misc
axis_bind_apply_timeout=100
focus_on_activate=1
idle_inhibit_ignore_visible=1
idle_inhibit_when_fullscreen=1
drag_tile_to_tile=1
tag_num=6

# Focus
sloppy_focus=1
warp_cursor=1
cursor_hide_timeout=5
focus_cross_tag=0
view_current_to_back=1
enable_floating_snap=0
drag_tile_to_tile=1

# Keyboard
repeat_rate=50
repeat_delay=250
numlock_on=1
xkb_rules_layout=br
xkb_rules_model=abnt2
xkb_rules_options=compose:rwin,caps:escape_shifted_capslock

# Trackpad
disable_trackpad=1

# Mouse
mouse_natural_scrolling=0
